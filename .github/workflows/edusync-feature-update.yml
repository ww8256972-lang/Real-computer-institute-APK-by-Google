name: EduSync Feature Update & UI Animation CI

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target to verify (debug, test, or release)'
        required: false
        default: 'all'

jobs:
  verify-feature-update:
    name: Verify UI Animations & Portal Enhancements
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon
