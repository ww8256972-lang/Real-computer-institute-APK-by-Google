name: EduSync Feature Update & UI Animation CI

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target to verify (debug, test, or release)'
        required: false
        default: 'all'

jobs:
  verify-feature-update:
    name: Verify UI Animations & Portal Enhancements
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Environment Secrets (.env)
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            echo "GEMINI_API_KEY=" > .env
          fi

      - name: Keystore Setup
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon -Djava.awt.headless=true

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon -Djava.awt.headless=true
